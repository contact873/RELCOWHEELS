<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2.6 264 116" role="img" aria-labelledby="t">
  <title id="t">RELCO Wheels, horizontal lockup with tagline</title>
  <!--
    The tagline lockup. Covers, decks, the back of a card, print. Not the website header, where a
    second line of type competes with the page.

    The tagline replaces EST. 2026 rather than sitting alongside it. Two small lines of caps under one
    rule is clutter, and the tagline is the more useful of the two in every place this file is used.
  -->
  <g transform="translate(14, 8)">
    <g transform="translate(0.1, -0.4)" fill="none" stroke="#0C1014" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 46 V18"/>
      <path d="M22 18 H33 a7.5 7.5 0 0 1 0 15 H22"/>
      <path d="M29 33.5 L41 45.5"/>
    </g>
    <circle cx="40" cy="45" r="4.6" fill="#C9541F"/>
  </g>
  <text x="72" y="45" font-family="Archivo, ui-sans-serif, 'Helvetica Neue', Arial, sans-serif" font-size="30"
        font-weight="700" font-stretch="118%" letter-spacing="0.3" fill="#0C1014">RELCO</text>
  <text x="74" y="58" font-family="'Public Sans', ui-sans-serif, 'Helvetica Neue', Arial, sans-serif" font-size="10.5"
        font-weight="600" letter-spacing="6.4" fill="#33414E">WHEELS</text>
  <line x1="72" y1="68" x2="232" y2="68" stroke="#C3CDD6" stroke-width="0.9"/>
  <text x="72" y="86" font-family="'Public Sans', ui-sans-serif, 'Helvetica Neue', Arial, sans-serif" font-size="11.5"
        font-weight="500" letter-spacing="1.5" fill="#33414E">Know what you&#8217;re buying.</text>
</svg>
