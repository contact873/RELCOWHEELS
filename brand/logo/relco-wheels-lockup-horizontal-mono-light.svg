<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 240 100" role="img" aria-labelledby="t">
  <title id="t">RELCO Wheels, single colour for dark backgrounds</title>
  <!--
    One colour only, for ink grounds, photography, and any printer with one plate.

    Note what is lost: the orange node becomes the same colour as the strokes, so the family signature
    disappears. That is the honest trade for single colour reproduction, and it is the reason this
    file exists as a separate variant rather than as a recolour of the primary.

    On screen, prefer the two colour mark with currentColor strokes, which keeps the node orange on
    both light and dark grounds.
  -->
  <g transform="translate(14, 8)">
    <g transform="translate(0.1, -0.4)" fill="none" stroke="#F5F1E8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 46 V18"/>
      <path d="M22 18 H33 a7.5 7.5 0 0 1 0 15 H22"/>
      <path d="M29 33.5 L41 45.5"/>
    </g>
    <circle cx="40" cy="45" r="4.6" fill="#F5F1E8"/>
  </g>
  <text x="72" y="45" font-family="Archivo, ui-sans-serif, 'Helvetica Neue', Arial, sans-serif" font-size="30"
        font-weight="700" font-stretch="118%" letter-spacing="0.3" fill="#F5F1E8">RELCO</text>
  <text x="74" y="58" font-family="'Public Sans', ui-sans-serif, 'Helvetica Neue', Arial, sans-serif" font-size="10.5"
        font-weight="600" letter-spacing="6.4" fill="#F5F1E8" opacity="0.72">WHEELS</text>
  <line x1="72" y1="68" x2="204" y2="68" stroke="#F5F1E8" stroke-width="0.9" opacity="0.32"/>
  <text x="204" y="80" text-anchor="end" font-family="'Public Sans', ui-sans-serif, 'Helvetica Neue', Arial, sans-serif"
        font-size="7.5" font-weight="600" letter-spacing="2.2" fill="#F5F1E8" opacity="0.72">EST. 2026</text>
</svg>
